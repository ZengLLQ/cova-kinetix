name: CovaKinetix CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Verify bytecode compilation
        run: python -m compileall -q src tests examples

      - name: Lint with flake8
        run: flake8 src tests examples --max-line-length=120 --extend-ignore=E203

      - name: Type-check with mypy
        run: mypy src

      - name: Run pytest suite
        run: pytest -v

      - name: CLI smoke checks
        run: |
          cova-kinetix --help
          python -m cova_kinetix.cli demo --seed 42 --metad-steps 600
          python -m cova_kinetix.cli quantum --smiles "C=CC(=O)Nc1ccccc1"
          python -m cova_kinetix.cli screen --target EGFR_C797S --top-k 5
          python -m cova_kinetix.cli permeate --smiles "C=CC(=O)Nc1ccc(NCc2ccccc2)cc1" --ph 7.4
          python -m cova_kinetix.cli metad --steps 800 --n-trajectories 4 --seed 7
          python -m cova_kinetix.cli evolve --target EGFR_C797S --generations 3 --pop-size 12 --seed 11
          python -m cova_kinetix.cli calibrate --n-sobol 32 --seed 13
          python -m cova_kinetix.cli benchmark --target EGFR_C797S

      - name: Execute standalone examples
        run: |
          python examples/01_warhead_fukui_quantum_screening.py
          python examples/02_pocket_burgi_dunitz_and_kinetics.py
          python examples/03_metadynamics_unbinding_and_permeation.py
          python examples/04_fragment_evolution_and_calibration.py
          python examples/05_end_to_end_kinase_benchmark.py
