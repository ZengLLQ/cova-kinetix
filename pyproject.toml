[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cova-kinetix"
version = "0.1.0"
description = "Structure-based covalent drug discovery platform integrating extended Huckel quantum reactivity, Poisson-Boltzmann induced-fit pocket scoring, well-tempered metadynamics kinetics, lipid bilayer permeation, and fragment evolution."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "ZengLLQ"}
]
keywords = [
    "covalent-inhibitors",
    "drug-discovery",
    "quantum-chemistry",
    "metadynamics",
    "membrane-permeability",
    "cheminformatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
]

[project.scripts]
cova-kinetix = "cova_kinetix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
